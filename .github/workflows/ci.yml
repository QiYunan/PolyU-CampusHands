name: Offline CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PRIMARY_PROVIDER: mock
      LLM_FALLBACK_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: backend
      - name: Run all backend tests offline
        run: python -m pytest -q
        working-directory: backend
      - name: Verify isolated Demo reset
        run: python -m app.demo reset
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend from lockfile
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm run test
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  tracked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tracked paths and obvious credentials
        run: python3 scripts/check_tracked_artifacts.py
